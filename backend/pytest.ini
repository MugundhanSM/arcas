[pytest]
# app/tests/ holds manual scripts, only tests/ is collected
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra -q --strict-markers
markers =
    unit: fast, dependency-free unit tests
    integration: tests that exercise multiple layers together
    requires_llm: tests that need a configured LLM provider (skipped otherwise)
    requires_semgrep: tests that need the semgrep CLI (skipped otherwise)
